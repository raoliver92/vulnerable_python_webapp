{% extends "base.html" %}
{% block title %}Login — JuiceShop{% endblock %}
{% block content %}
<div style="max-width:400px;margin:0 auto;">
  <div class="card">
    <div class="card-body">
      <h2 style="text-align:center;margin-bottom:1.5rem;">Sign In</h2>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" required autofocus />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required />
        </div>
        <button class="btn btn-primary" style="width:100%;padding:.65rem;">Login</button>
      </form>
      <p style="text-align:center;margin-top:1rem;color:#777;">
        No account? <a href="/register">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
